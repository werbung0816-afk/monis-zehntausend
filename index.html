<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moni's Zehntausend Multiplayer</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:radial-gradient(circle at top,#2b1055,#090014);
color:white;
min-height:100vh;
overflow-x:hidden;
}

.wrapper{
max-width:1200px;
margin:auto;
padding:30px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

.logo{
font-size:54px;
font-weight:900;
line-height:1;
background:linear-gradient(90deg,#ff7ad9,#8fd3ff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.panel{
background:rgba(255,255,255,.06);
backdrop-filter:blur(14px);
border-radius:28px;
padding:24px;
box-shadow:0 0 30px rgba(0,0,0,.25);
margin-bottom:24px;
}

.row{
display:grid;
grid-template-columns:1fr 320px;
gap:24px;
}

button{
border:none;
border-radius:18px;
padding:16px 24px;
font-size:18px;
font-weight:800;
cursor:pointer;
background:linear-gradient(90deg,#8b5cf6,#ec4899);
color:white;
}

input{
width:100%;
padding:16px;
border:none;
border-radius:18px;
background:#140f2e;
color:white;
font-size:18px;
box-sizing:border-box;
margin-bottom:12px;
}

#dice{
font-size:120px;
text-align:center;
margin:20px 0;
}

#status{
font-size:28px;
font-weight:800;
text-align:center;
}

.player{
padding:14px;
border-radius:16px;
background:rgba(255,255,255,.08);
margin-bottom:10px;
}

.chat{
height:220px;
overflow:auto;
background:rgba(0,0,0,.2);
padding:14px;
border-radius:18px;
margin-bottom:12px;
}

.chatmsg{
padding:8px 0;
border-bottom:1px solid rgba(255,255,255,.08);
}

@media(max-width:900px){
.row{
grid-template-columns:1fr;
}
}
</style>
</head>

<body>

<div class="wrapper">

<div class="header">
<div class="logo">
Moni's<br>Zehntausend
</div>

<div>
🌍 Multiplayer Beta
</div>
</div>

<div class="row">

<div>

<div class="panel">

<h2>Spiel</h2>

<input id="playerName" placeholder="Dein Name">

<button id="joinBtn">
Beitreten
</button>

<div id="status">
Kein aktiver Wurf
</div>

<div id="dice">
🎲
</div>

<button id="rollBtn">
Würfeln
</button>

</div>

</div>

<div>

<div class="panel">

<h2>Online Spieler</h2>

<div id="players"></div>

</div>

<div class="panel">

<h2>Chat</h2>

<div id="chat" class="chat"></div>

<input id="chatInput" placeholder="Nachricht">

<button id="sendChat">
Senden
</button>

</div>

</div>

</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getDatabase,
ref,
set,
push,
onValue
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {

apiKey: "AIzaSyC5wUppAxAE_LrEpr8FdLafqNuyic59HV8",
authDomain: "romme-hand.firebaseapp.com",
databaseURL:
"https://romme-hand-default-rtdb.europe-west1.firebasedatabase.app",
projectId: "romme-hand",
storageBucket: "romme-hand.firebasestorage.app",
messagingSenderId: "848283747928",
appId:
"1:848283747928:web:5ebdf681451ea87bdac2d"

};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

console.log("🔥 Firebase verbunden");

const playersRef = ref(db,"players");
const gameRef = ref(db,"game");
const chatRef = ref(db,"chat");

document.getElementById("joinBtn")
.addEventListener("click",()=>{

const name =
document.getElementById("playerName")
.value.trim();

if(!name) return;

set(
ref(db,"players/" + name),
{
name:name,
score:0,
online:true
}
);

});

document.getElementById("rollBtn")
.addEventListener("click",()=>{

const name =
document.getElementById("playerName")
.value.trim();

if(!name) return;

const dice =
Math.floor(Math.random()*6)+1;

set(gameRef,{
player:name,
dice:dice,
updated:Date.now()
});

});

onValue(playersRef,(snapshot)=>{

const data = snapshot.val();

const container =
document.getElementById("players");

container.innerHTML = "";

if(!data) return;

Object.values(data).forEach(player=>{

const div =
document.createElement("div");

div.className = "player";

div.innerHTML =
"<b>" + player.name + "</b>";

container.appendChild(div);

});

});

onValue(gameRef,(snapshot)=>{

const data = snapshot.val();

if(!data) return;

document.getElementById("status")
.innerText =
data.player + " würfelte";

document.getElementById("dice")
.innerText = data.dice;

});

document.getElementById("sendChat")
.addEventListener("click",()=>{

const name =
document.getElementById("playerName")
.value.trim();

const msg =
document.getElementById("chatInput")
.value.trim();

if(!name || !msg) return;

push(chatRef,{
name:name,
msg:msg
});

document.getElementById("chatInput")
.value = "";

});

onValue(chatRef,(snapshot)=>{

const data = snapshot.val();

const chat =
document.getElementById("chat");

chat.innerHTML = "";

if(!data) return;

Object.values(data).forEach(entry=>{

const div =
document.createElement("div");

div.className = "chatmsg";

div.innerHTML =
"<b>" + entry.name + ":</b> " + entry.msg;

chat.appendChild(div);

});

chat.scrollTop = chat.scrollHeight;

});

</script>

</body>
</html>
