<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Moni's Zehntausend</title>

<link
rel="stylesheet"
href="style.css">

<link
href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap"
rel="stylesheet">

</head>

<body>

<div id="app">

<!-- HEADER -->

<header class="topbar">

<div class="logoWrap">

<img
src="assets/moni-title.png"
class="titleArt">

<h1>
Moni's Zehntausend
</h1>

</div>

<div class="onlineBadge">
🌍 Multiplayer Online
</div>

</header>


<!-- LOBBY -->

<section id="lobby">

<div class="panel">

<h2>Spieler</h2>

<div id="playerList"></div>

</div>


<div class="panel">

<h2>Chat</h2>

<div id="chatMessages"></div>

<textarea
id="chatInput"
placeholder="Nachricht schreiben..."></textarea>

<button id="sendChatBtn">
Senden
</button>

</div>


<div class="panel">

<h2>Sprachchat</h2>

<a
class="jitsiBtn"
href="https://meet.jit.si/monis-zehntausend"
target="_blank">

🎤 Jitsi öffnen

</a>

</div>

</section>


<!-- GAME -->

<main id="gameArea">

<div class="panel gamePanel">

<div id="roundCounter">
1 / 10
</div>

<div id="diceArea"></div>

<div class="actionButtons">

<button id="rollBtn">
Würfeln
</button>

<button id="bankBtn">
Sichern
</button>

<button id="endBtn">
Zug beenden
</button>

</div>

</div>

</main>


<!-- WINNER -->

<div id="winnerOverlay">

<div class="winnerContent">

<h2>Spiel beendet</h2>

<div id="winnerList"></div>

<button id="restartBtn">
Neue Runde
</button>

</div>

</div>

</div>


<script type="module"
src="firebase.js"></script>

<script type="module"
src="app.js"></script>

</body>
</html>
