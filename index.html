<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moni's Zehntausend</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

<div class="topbar">
<h1>Moni's Zehntausend</h1>
<div class="onlineBadge">🌍 Multiplayer Online</div>
</div>

<div id="lobby">

<div class="panel">
<h2>Spieler</h2>
<div id="playerList">
<div class="playerCard">Saschix</div>
<div class="playerCard">Dani (KI)</div>
</div>
</div>

<div class="panel">
<h2>Chat</h2>
<div id="chatMessages"></div>
<textarea id="chatInput" placeholder="Nachricht schreiben..."></textarea>
<button id="sendChatBtn">Senden</button>
</div>

<div class="panel">
<h2>Sprachchat</h2>
<a class="jitsiBtn" href="https://meet.jit.si/monis-zehntausend" target="_blank">
🎤 Jitsi öffnen
</a>
</div>

</div>

<div class="panel gamePanel">

<div id="roundCounter">
1 / 10
</div>

<div id="diceArea"></div>

<div class="actionButtons">
<button id="rollBtn">Würfeln</button>
<button id="bankBtn">Sichern</button>
<button id="endBtn">Zug beenden</button>
</div>

</div>

<div id="winnerOverlay">

<div class="winnerContent">

<h2>🏆 SCHNELLE 10</h2>

<div id="winnerList">

<div class="winnerCard">
<h3>1. Platz</h3>
<p>Saschix</p>
<h1>2000</h1>
</div>

<div class="winnerCard">
<h3>2. Platz</h3>
<p>Dani (KI)</p>
<h1>1750</h1>
</div>

</div>

<button id="restartBtn">
Neues Spiel
</button>

</div>

</div>

</div>

<script src="app.js"></script>

</body>
</html>
